server:
  port: ${SERVER_PORT:8800}

spring:
  application:
    name: docbase

  # 默认激活 local profile。
  # 本地开发的实际连接信息放在 application-local.yaml（该文件不入库，见 .gitignore），
  # 所以刚 clone 下来、没有这个文件时，会安静地回退到本文件里的 ${ENV:default} 默认值（指向 localhost）。
  profiles:
    default: local

  # 启动时校验 JVM 的文件编码，不是"设置"。
  # file.encoding 是 JVM 系统属性，Spring 启动时 JVM 早已初始化完，yaml 改不了它。
  # JDK 18+ 默认 UTF-8（JEP 400），本项目跑 JDK 21 实测已是 UTF-8；
  # 这行的作用是启动时断言：编码不对就直接失败，而不是摄入跑了一半才发现中文乱码。
  mandatory-file-encoding: UTF-8

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  ai:
    # 嵌入模型走 Ollama（本地、离线）。改用别的 provider 时改这里。
    model:
      embedding: ollama

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        # 问答模型。这里给的是 Ollama 官方仓库里能直接 pull 的标签，
        # 保证 clone 下来就能跑；显存小的话在 application-local.yaml 里覆盖成 lowvram 变体。
        # 换模型不需要改代码：--spring.ai.ollama.chat.model=xxx
        model: "${CHAT_MODEL:qwen2.5:3b}"
        options:
          # 温度 0.1，不是 0.7。
          #
          # RAG 问答是"从给定材料里抽事实"，不是创作，随机性是负担不是优点。
          # 实测（同一问题问 3 次，模型 qwen2.5-3b-lowvram，topK=5）：
          #   temperature 0.7 → 1/3 次答对（另两次说"没找到"，或把答案说成同义反复）
          #   temperature 0.1 → 3/3 次答对，且都能说出答案里的关键机制名
          # 温度高时 3B 模型会在"保守说不知道"和"自由发挥"之间随机跳。
          #
          # 不要再调回 0.7：Modelfile 里那行 temperature 只是模型默认值，这里会覆盖它。
          temperature: ${TEMPERATURE:0.1}

          # 上下文窗口。这个值必须和 rag.chat.top-k 一起看：
          #   全库 chunk 实测平均 532 token、最大 604（CL100K 真实分词，不是按字符估算），
          #   topK × 平均 ≈ 片段占用，再加问题/指令/回答约 700。
          #   topK=5 → 约 3,360，4096 刚好够；
          #   topK=8 → 约 4,960，必须提到 6144，否则超出部分被 Ollama 静默截断。
          # 显存代价（qwen2.5 有 2 个 KV head，约 36 KB/token）：
          #   4096 ≈ 144 MB，6144 ≈ 216 MB，8192 ≈ 288 MB。
          num-ctx: ${NUM_CTX:4096}
      embedding:
        # bge-m3：中文强，1024 维，8192 上下文。
        # 换 embedding 模型必须同步改下面的 dimensions 并重建索引，否则维度不匹配。
        model: ${EMBEDDING_MODEL:bge-m3}

    vectorstore:
      redis:
        host: ${REDIS_HOST:localhost}
        port: ${REDIS_PORT:6379}
        index-name: work-docs-index
        # Redis Key 前缀，实际键名形如 doc:<sha256前32位>#<chunk序号>
        prefix: "doc:"
        # 必须与 embedding 模型输出维度一致（bge-m3 = 1024，all-MiniLM-L6-v2 = 384）
        dimensions: 1024
        # 启动时自动创建索引（幂等，已存在则跳过）
        initialize-schema: true

rag:
  # 问答检索参数
  chat:
    # 检索返回的片段数。默认 5 —— 这是实测选出来的，不是保守。
    #
    # 同一批问题对比 topK=5 与 topK=8（temperature 0.1，各跑 3 次）：
    #   精确问题（"X 是什么时候做的"）: topK=5 → 3/3 答对；topK=8 → 0/3 答对
    #   泛问（"X 是怎么做的"）        : topK=5 → 答不上；  topK=8 → 答得很好
    # 也就是说 topK 拉大确实能救泛问，但 3B 模型在 8 个片段里会丢针，精确问答直接崩。
    # 这个取舍没法用参数两全 —— 真正的解法是 rerank（宽召回 + 重排到 5），
    # 但那要多一个 reranker 模型，3 GB 显存放不下。
    #
    # 另外：topK 受 num-ctx 硬约束，装不下的片段会被静默截断，等于白检索。
    top-k: ${TOP_K:5}
    # 问答提示词模板（classpath 位置）。
    # 不用 Spring AI 的默认模板，因为它的最后一句是
    #   "If the answer is not in the context, inform the user that you can't answer the question"
    # 3B 会严格照做：只要没有一个片段完整覆盖问题就整句拒答。
    # 实测泛问题目的 gold 就在 top-5 里，模型仍然回答"上下文中没有提供相关信息"。
    prompt-file: ${QA_PROMPT_FILE:prompts/qa.txt}
    # 相似度阈值（0~1），0 = 不过滤。
    # 默认关：不同 embedding 的分数分布不同，bge-m3 + COSINE 集中在 0.5~0.8，
    # 套一个通用阈值容易把相关内容一起滤掉。要开先量分布再定。
    similarity-threshold: ${SIMILARITY_THRESHOLD:0}

  sanitize:
    # 是否在正则脱敏之后再走一遍小模型做语义脱敏。
    #
    # 默认关闭。实测单 chunk 需要 17~34 秒（生成速度 32.5 tok/s 是 3GB 显存的硬件上限，
    # 并发无收益），6.5 万个文档 chunk 要 13~26 天；且人名召回率只有 20%
    # （5 个名字只换掉 1 个），还会把字段名"人民币金额"误替换成 [PERSON]。
    # 结论：正则脱敏已足够覆盖 IP / 账号 / 密钥这类结构化信息，语义脱敏不划算。
    #
    # 需要时用 --rag.sanitize.ai-enabled=true 临时打开，建议只对少量叙述性文档开。
    ai-enabled: false
    # 语义脱敏专用模型。默认关闭该功能，所以这里给官方标签即可；
    # 真要开的时候建议在 application-local.yaml 里换成自己调过的模型。
    # 注意 qwen 系列处理中文姓名会只换姓不换名（"王建国"→"[PERSON]建国"），属于假脱敏。
    model: "${SANITIZE_MODEL:llama3.2:3b}"

  # 摄入行为
  ingest:
    # Redis 内存软上限（MB），0 = 不限制。
    # 每处理若干个文件查一次 used_memory，超限就停止本批并打日志；
    # 已完成的文件重跑时会自动跳过，所以停下来是安全的。
    # 实测单 chunk 真实成本约 36.9 KB（含 HNSW 索引），按目标机器可用内存倒推这个值。
    max-redis-memory-mb: 1000

    # 目录摄入时每处理多少个文件打一行进度。
    # 每个文件一行在几万文件的规模下会写出几百 MB 日志。
    progress-every: 50

    # 单次提交给 embedding 模型的 chunk 数。
    # 一次性提交整批会让吞吐塌陷：实测 686 个 chunk 一次发送后 17 分钟没有返回，
    # 而分批后稳定在 0.18~0.3 秒/chunk，且每批都有进度可观测。
    embed-batch-size: 64

    # 单文件最多保留多少个 chunk，超出截断。0 = 不限制（默认）。
    # 截断会让文件不完整（686 个只留 300 就丢了 56%），所以默认关闭；
    # 留这个开关是为了应对真正的病态文件。
    max-chunks-per-file: 0

  # 知识库体检 / 修复定时任务
  # 默认关闭：体检要扫全库的键，修复要重新解析 + 嵌入，跑之前先确认没有别的摄入任务。
  maintenance:
    enabled: false
    # 体检（孤儿 / 残缺 / 重复，只读不修改）
    report-cron: "0 30 3 * * ?"
    # 修复残缺（删掉重摄），单次最多修 fix-limit 个
    fix-cron: "0 30 4 * * ?"
    fix-limit: 50
    # 体检时是否顺带查重复文件（要读文件内容，比较慢）
    check-duplicates: true
